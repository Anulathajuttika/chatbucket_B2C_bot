<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatBucket Assistant</title>
<link rel="stylesheet" href="/static/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <button id="newChatBtn" class="new-chat-btn">
        <span class="plus">+</span> New Chat
      </button>
      <div class="sidebar-footer">
        <div class="bot-brand">
          <div class="brand-avatar">CB</div>
          <div>
            <div class="brand-name">ChatBucket</div>
            <div class="brand-sub">Support Assistant</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="chat-main">
      <header class="chat-header">
        <h1>ChatBucket &amp; ToDoZee Assistant</h1>
        <p>Ask me anything about ChatBucket or ToDoZee</p>
      </header>

      <div id="chatWindow" class="chat-window">
        <div class="message bot-message">
          <div class="avatar bot-avatar">CB</div>
          <div class="bubble">
            Hi! I'm the ChatBucket assistant. Ask me anything about
            <strong>ChatBucket</strong> or <strong>ToDoZee</strong>.
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            placeholder="Message ChatBucket Assistant..."
            rows="1"
            maxlength="2000"
          ></textarea>
          <button id="sendBtn" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <div class="disclaimer">Answers are limited to ChatBucket and ToDoZee knowledge.</div>
      </div>
    </main>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
